[package]
name = "starprint-api"
version = "1.1.0"
description = "Local HTTP server that prints starprint jobs to profiled Star printers"
edition.workspace = true
# `File::try_lock`, for the data directory. The library keeps the workspace floor.
rust-version = "1.89"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "multipart", "tokio"] }
# The scheduler's clock and a scheduled task card's due date.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
croner = "4"
# The platform's configuration directory, for the default data directory.
dirs = "6"
# The decoded picture a job or preview is built from.
image = { version = "0.25", default-features = false, features = ["png"] }
# Talking to fax relays.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# MCP at `/mcp`, on the router the REST routes are on.
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
# The schemas of the tools' arguments, from the types that read them.
schemars = "1"
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps GET /v1/printers in the order the file lists.
serde_json = { version = "1", features = ["preserve_order"] }
starprint = { path = "../../crates/starprint", features = ["image"] }
starprint-fax = { path = "../../crates/starprint-fax" }
starprint-workflows = { path = "../../crates/starprint-workflows" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "signal", "time", "macros"] }
# Tokens and schedule ids.
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# A stand-in printer to write to, and the router driven without a
# socket. `macros` is for `#[tokio::test]`; startup builds its runtime
# by hand.
# A data directory that is thrown away after the test.
tempfile = "3"
# A real relay for the fax tests to send through.
starprint-relay = { path = "../starprint-relay" }
tokio = { version = "1", features = ["io-util", "macros", "time", "test-util"] }
tower = { version = "0.5", features = ["util"] }

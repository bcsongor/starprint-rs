[package]
name = "starprint-gui"
version = "1.1.0"
description = "Desktop app for printing to Star receipt printers"
edition.workspace = true
# Tauri 2.12 needs it. The library keeps the workspace floor.
rust-version = "1.90"
license.workspace = true
repository.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the library name from clashing with the binary
# on Windows, as the Tauri template recommends.
name = "starprint_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
# The addresses the server may listen on.
if-addrs = "0.15"
# The server the app is a client of, run in-process.
starprint-api = { path = "../../starprint-api" }
# The Tauri CLI will not build unless these are on the same minor as
# their npm packages in `package.json`, so `~` holds each to its minor
# and the two sides are bumped together. Left at `2`, cargo holds them
# at the newest minor the workspace's Rust floor allows while the npm
# side moves on, and a bare `2.12` lets a lockfile refresh run ahead.
tauri = { version = "~2.12", features = [] }
tauri-plugin-store = "~2.5"

[dev-dependencies]
# A data directory that is thrown away after the test.
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
# Paints the title bar in the app's own colour (DwmSetWindowAttribute).
windows-sys = { version = "0.61", features = ["Win32_Graphics_Dwm"] }

[package]
name = "starprint-gui"
version = "1.0.0"
description = "Desktop app for printing to Star receipt printers"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the library name from clashing with the binary
# on Windows, as the Tauri template recommends.
name = "starprint_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
# PNG encoding for the picture preview; decoding lives in starprint.
image = { version = "0.25", default-features = false, features = ["png"] }
starprint = { path = "../../../crates/starprint", features = ["image"] }
# The addresses the HTTP API may listen on.
if-addrs = "0.15"
# The HTTP API, served from inside the app behind a toggle.
starprint-api = { path = "../../starprint-api" }
starprint-workflows = { path = "../../../crates/starprint-workflows" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# Paints the title bar in the app's own colour (DwmSetWindowAttribute).
windows-sys = { version = "0.61", features = ["Win32_Graphics_Dwm"] }

version: 2

# One grouped pull request a month per ecosystem. The workflows pin
# actions by commit hash, so nothing short of a bot notices a new
# release; Dependabot rewrites the hash and the `# vX.Y.Z` comment
# beside it together.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /apps/starprint-gui
    schedule:
      interval: monthly
    groups:
      bun:
        patterns: ["*"]

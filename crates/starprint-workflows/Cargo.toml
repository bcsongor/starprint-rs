[package]
name = "starprint-workflows"
version = "1.0.0"
description = "Ready-made Star printer jobs: task cards, text, note slips, QR codes, pictures and head-check pages"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Depends on `starprint` by path, so it cannot be published as it stands.
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Decoding for picture jobs; the callers hand over image data, not a path.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
# QR symbols are encoded here rather than by the printer, so the impact
# head can print them too. See `qr`.
qrcodegen = "1.8"
serde = { version = "1", features = ["derive"] }
starprint = { path = "../starprint", features = ["image"] }

[dev-dependencies]
serde_json = "1"

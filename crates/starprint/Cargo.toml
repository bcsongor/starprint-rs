[package]
name = "starprint"
version = "1.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Driver library for Star Micronics receipt printers: Star Line Mode (thermal) and the Star impact (SP700) command set, over Ethernet."
license.workspace = true
repository.workspace = true
keywords = ["star", "receipt", "printer", "pos", "starline"]
categories = ["hardware-support"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "webp", "bmp"] }

[features]
## Image preparation pipeline (decode, tone mapping, resize) in the
## `pipeline` module. The core protocol layer stays dependency-free.
image = ["dep:image"]

[[example]]
name = "impact_image"
required-features = ["image"]

[[example]]
name = "thermal_image"
required-features = ["image"]

[[example]]
name = "thermal_scale_template"
required-features = ["image"]
